<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" stroke="#2B2118" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Background texture: drafting-sheet floor plans, tiled behind the cream sections.
    Group opacity multiplies, so every group below is kept very low on purpose.
  -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5L9 5L0 8.5" fill="#2B2118" stroke="none"/>
    </marker>
    <marker id="tk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2 8L8 2" stroke="#2B2118" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ===== long construction lines + compass arcs (faintest layer) ===== -->
  <g opacity=".03" stroke-width=".8" stroke-dasharray="1 7">
    <path d="M0 64H1200M0 612H1200M64 0V1200M682 0V1200M0 1010L1200 330"/>
    <path d="M-120 820A560 560 0 0 1 560 140" stroke-dasharray="none"/>
    <path d="M1320 1120A460 460 0 0 0 860 660" stroke-dasharray="none"/>
  </g>

  <!-- ===== PLAN A: L-shaped unit, upper left ===== -->
  <g transform="translate(150 190)">
    <!-- walls -->
    <g opacity=".055">
      <path d="M0 0H520V260H380V400H0Z" stroke-width="4.5"/>
      <path d="M9 9H511V251H371V391H9Z" stroke-width=".7"/>
      <path d="M200 0V150M200 210V400M0 220H140M200 260H380M330 0V110M330 150V260" stroke-width="2.2"/>
    </g>
    <!-- openings: doors, windows -->
    <g opacity=".045" stroke-width=".9">
      <path d="M200 150H260M260 150A60 60 0 0 1 200 210" />
      <path d="M140 220V160M140 160A60 60 0 0 1 200 220"/>
      <path d="M330 110H370M370 110A40 40 0 0 1 330 150"/>
      <path d="M60 -3H150M60 3H150M380 -3H470M380 3H470M517 70V180M523 70V180M60 397H150M60 403H150M-3 260V340M3 260V340"/>
    </g>
    <!-- fixtures -->
    <g opacity=".035" stroke-width=".8">
      <rect x="34" y="40" width="112" height="128" rx="3"/>
      <rect x="42" y="48" width="44" height="22" rx="4"/><rect x="94" y="48" width="44" height="22" rx="4"/>
      <path d="M34 100H146"/>
      <rect x="340" y="12" width="170" height="26" rx="2"/><circle cx="425" cy="25" r="7"/>
      <rect x="388" y="96" width="90" height="42" rx="3"/>
      <circle cx="265" cy="75" r="30"/>
      <circle cx="265" cy="33" r="7"/><circle cx="265" cy="117" r="7"/><circle cx="223" cy="75" r="7"/><circle cx="307" cy="75" r="7"/>
      <path d="M28 372V296H62V338H150V372Z"/><rect x="80" y="286" width="58" height="34" rx="3"/>
      <!-- stair with walk line -->
      <path d="M226 278H300V388H226Z"/>
      <path d="M226 292H300M226 306H300M226 320H300M226 334H300M226 348H300M226 362H300M226 376H300"/>
      <path d="M263 382V288" marker-end="url(#ar)"/>
    </g>
    <!-- dimension strings with slash ticks -->
    <g opacity=".045" stroke-width=".7">
      <path d="M0 -44H200H330H520" marker-start="url(#tk)" marker-mid="url(#tk)" marker-end="url(#tk)"/>
      <path d="M0 -56V-12M200 -56V-12M330 -56V-12M520 -56V-12"/>
      <path d="M-44 0V220V400" marker-start="url(#tk)" marker-mid="url(#tk)" marker-end="url(#tk)"/>
      <path d="M-56 0H-12M-56 220H-12M-56 400H-12"/>
      <path d="M564 0V260" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <path d="M552 0H576M552 260H576"/>
    </g>
    <!-- structural grid bubbles -->
    <g opacity=".04" stroke-width=".7">
      <path d="M200 -86V446M330 -86V446M-86 220H606" stroke-dasharray="10 4 2 4"/>
      <circle cx="200" cy="-100" r="13"/><circle cx="330" cy="-100" r="13"/><circle cx="-100" cy="220" r="13"/>
      <path d="M194 -100H206M330 -106V-94M-106 216H-94M-106 224H-94"/>
    </g>
    <!-- section cut marker -->
    <g opacity=".045" stroke-width=".8">
      <path d="M-70 318H-20M540 318H600" stroke-dasharray="14 5"/>
      <circle cx="-84" cy="318" r="13"/><path d="M-97 318H-71"/><path d="M-84 305L-70 318H-98Z" fill="#2B2118" fill-opacity=".6" stroke="none"/>
      <circle cx="614" cy="318" r="13"/><path d="M601 318H627"/><path d="M614 305L628 318H600Z" fill="#2B2118" fill-opacity=".6" stroke="none"/>
    </g>
  </g>

  <!-- ===== PLAN B: pinned sheet, lower right, slightly rotated ===== -->
  <g transform="translate(735 690) rotate(-5)">
    <!-- sheet edge + title block -->
    <g opacity=".035" stroke-width=".8">
      <rect x="-40" y="-40" width="420" height="380" rx="2"/>
      <path d="M-40 300H380M240 300V340M300 300V340"/>
      <path d="M-24 316H120M-24 326H80"/>
    </g>
    <!-- walls -->
    <g opacity=".055">
      <path d="M0 0H340V260H0Z" stroke-width="4"/>
      <path d="M8 8H332V252H8Z" stroke-width=".7"/>
      <path d="M140 0V90M140 140V260M140 170H340M250 170V260" stroke-width="2"/>
    </g>
    <g opacity=".045" stroke-width=".9">
      <path d="M140 90H190M190 90A50 50 0 0 1 140 140"/>
      <path d="M250 200V170M250 170" /><path d="M200 170V214M200 214A44 44 0 0 0 244 170"/>
      <path d="M40 -3H110M40 3H110M200 -3H300M200 3H300M337 40V120M343 40V120"/>
    </g>
    <!-- bath: tub, wc, basin -->
    <g opacity=".035" stroke-width=".8">
      <rect x="258" y="180" width="72" height="34" rx="12"/>
      <ellipse cx="290" cy="236" rx="11" ry="13"/><rect x="280" y="244" width="20" height="8" rx="2"/>
      <rect x="160" y="226" width="30" height="22" rx="6"/>
      <rect x="24" y="30" width="96" height="120" rx="3"/><path d="M24 62H120"/>
      <path d="M170 24H310V60H170Z"/><circle cx="240" cy="42" r="6"/>
    </g>
    <g opacity=".045" stroke-width=".7">
      <path d="M0 290H140H340" marker-start="url(#tk)" marker-mid="url(#tk)" marker-end="url(#tk)"/>
      <path d="M0 270V300M140 270V300M340 270V300"/>
    </g>
    <!-- pins -->
    <g opacity=".09">
      <circle cx="-26" cy="-26" r="6" fill="#C44C14" stroke="none"/><circle cx="366" cy="-26" r="6" fill="#C44C14" stroke="none"/>
      <circle cx="-26" cy="326" r="6" fill="#C44C14" stroke="none"/><circle cx="366" cy="326" r="6" fill="#C44C14" stroke="none"/>
    </g>
  </g>

  <!-- ===== detail: north arrow + scale bar, lower left ===== -->
  <g transform="translate(150 900)" opacity=".045" stroke-width=".8">
    <circle cx="30" cy="30" r="26"/>
    <path d="M30 0L40 44L30 36L20 44Z"/><path d="M30 0L30 36L20 44Z" fill="#2B2118" fill-opacity=".7" stroke="none"/>
    <path d="M90 50H330M90 44V56M150 44V56M210 44V56M270 44V56M330 44V56"/>
    <path d="M90 46H150V54H90ZM210 46H270V54H210Z" fill="#2B2118" fill-opacity=".7" stroke="none"/>
  </g>

  <!-- ===== callouts: leader lines with arrows + tag bubbles ===== -->
  <g opacity=".04" stroke-width=".8">
    <path d="M820 250C880 220 900 300 780 330" marker-end="url(#ar)"/>
    <circle cx="820" cy="250" r="3" fill="#2B2118" stroke="none"/>
    <path d="M834 236H930" />
    <path d="M500 780C540 720 610 760 660 700" marker-end="url(#ar)"/>
    <circle cx="500" cy="780" r="3" fill="#2B2118" stroke="none"/>
    <rect x="410" y="790" width="92" height="22" rx="11"/>
    <path d="M1000 140V96H1080" marker-end="url(#ar)"/>
    <circle cx="1000" cy="140" r="10"/>
  </g>

  <!-- ===== loose pins on the board ===== -->
  <g opacity=".08" fill="#C44C14" stroke="none">
    <circle cx="118" cy="148" r="5"/><circle cx="702" cy="160" r="5"/><circle cx="1110" cy="560" r="5"/>
  </g>
</svg>
