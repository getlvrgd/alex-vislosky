<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Fine paper grain behind the cream sections. Warm ink, very low alpha. -->
  <filter id="g" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .17  0 0 0 0 .13  0 0 0 0 .09  0 0 0 .7 -.22"/>
  </filter>
  <rect width="240" height="240" filter="url(#g)" opacity=".22"/>
</svg>
